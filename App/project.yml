name: Posizione
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: Posizione/Posizione-Bridging-Header.h
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/lib/$(PLATFORM_NAME)"
    OTHER_LDFLAGS: "-lposizione_engine"
    ENABLE_BITCODE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
targets:
  Posizione:
    type: application
    platform: iOS
    sources: [Posizione]
    info:
      path: Posizione/Info.plist
      properties:
        CFBundleDisplayName: Posizione
        UILaunchScreen: {}
        NSBonjourServices: ["_remotepairing._tcp", "_remotepairing-manual-pairing._tcp"]
        NSLocalNetworkUsageDescription: "Serve per parlare con il telefono stesso tramite LocalDevVPN."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacopo.posizione
