[package]
name = "posizione_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = ["ring", "tcp", "core_device_proxy", "tunnel_tcp_stack", "rsd", "xpc", "dvt", "location_simulation"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
